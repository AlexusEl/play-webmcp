name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
    paths-ignore: [README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: Play ${{ matrix.play }} / Scala ${{ matrix.scala }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        play: ['3.0.10', '3.0.11']
        scala: ['2.13.18', '3.3.6']
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -Dplay.version=${{ matrix.play }} "++${{ matrix.scala }}" test

  browser:
    name: Runtime and native Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: sbt javaExample/stage scalaExample/stage
      - run: bash scripts/browser-check.sh
      - run: WEBMCP_TEST_CONTEXT_PATH=/shop bash scripts/browser-check.sh

  distribution:
    name: Package artifacts for Play 2.8, 2.9 and 3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: >-
          sbt 'set ThisBuild / publishTo := Some(Resolver.file("staging", file("target/maven-repository"))(Resolver.mavenStylePatterns))'
          +webmcp/test +webmcp/publish +webmcpPlay29/test +webmcpPlay29/publish +webmcpPlay28/test +webmcpPlay28/publish
      - run: python3 scripts/check-artifacts.py target/maven-repository 0.5.0
      - uses: actions/upload-artifact@v4
        with:
          name: module-maven-repository
          path: target/maven-repository
          if-no-files-found: error

  consumers:
    name: Install in Play ${{ matrix.play }} / ${{ matrix.scala || 'both Scala families' }} / Java ${{ matrix.java }} / sbt ${{ matrix.sbt || '1.11.7' }}
    needs: distribution
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { play: '3.0.0', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.1', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.2', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.3', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.4', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.5', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.6', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.7', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.8', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.9', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.10', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '3.0.11', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.0', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.1', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.2', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.3', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.4', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.5', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.6', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.7', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.8', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.9', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.10', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.9.11', java: '11', scala: '', sbt: '1.11.7' }
          - { play: '2.8.0', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.1', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.2', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.3', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.4', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.5', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.6', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.7', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.8', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.9', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.10', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.11', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.12', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.13', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.14', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.15', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.16', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.17', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.18', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.19', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.20', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.21', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '2.8.22', java: '11', scala: '', sbt: '1.5.8' }
          - { play: '3.0.0', java: '11', scala: '2.13.12', sbt: '1.9.9' }
          - { play: '3.0.0', java: '11', scala: '3.3.1', sbt: '1.9.9' }
          - { play: '3.0.11', java: '17', scala: '', sbt: '1.11.7' }
          - { play: '3.0.11', java: '21', scala: '', sbt: '1.11.7' }
          - { play: '2.9.0', java: '11', scala: '2.13.12', sbt: '1.9.9' }
          - { play: '2.9.0', java: '11', scala: '3.3.1', sbt: '1.9.9' }
          - { play: '2.9.11', java: '17', scala: '', sbt: '1.11.7' }
          - { play: '2.9.11', java: '21', scala: '', sbt: '1.11.7' }
          - { play: '2.8.0', java: '8', scala: '2.12.10', sbt: '1.3.13' }
          - { play: '2.8.0', java: '8', scala: '2.13.1', sbt: '1.3.13' }
          - { play: '2.8.22', java: '8', scala: '', sbt: '1.5.8' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/download-artifact@v4
        with:
          name: module-maven-repository
          path: target/consumer-maven
      - run: WEBMCP_REPOSITORY="file://$PWD/target/consumer-maven" bash scripts/consumer-check.sh
        env:
          PLAY_VERSION: ${{ matrix.play }}
          SCALA_VERSION: ${{ matrix.scala }}
          SBT_VERSION: ${{ matrix.sbt || '1.11.7' }}

  play2-browser:
    name: Native Chromium / Play ${{ matrix.play }} / Java ${{ matrix.java }}
    needs: distribution
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { play: '2.8.22', scala: '2.12.20', java: '8', sbt: '1.5.8' }
          - { play: '2.9.11', scala: '3.3.6', java: '17', sbt: '1.11.7' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: module-maven-repository
          path: target/consumer-maven
      - run: |
          WEBMCP_REPOSITORY="file://$PWD/target/consumer-maven" bash scripts/consumer-check.sh
          WEBMCP_REPOSITORY="file://$PWD/target/consumer-maven" WEBMCP_TEST_CONTEXT_PATH=/shop bash scripts/consumer-check.sh
        env:
          PLAY_VERSION: ${{ matrix.play }}
          SCALA_VERSION: ${{ matrix.scala }}
          SBT_VERSION: ${{ matrix.sbt }}
          WEBMCP_BROWSER_CHECK: '1'
