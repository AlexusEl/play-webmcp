name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
    paths-ignore: [README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: Play ${{ matrix.play }} / Scala ${{ matrix.scala }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        play: ['3.0.10', '3.0.11']
        scala: ['2.13.18', '3.3.6']
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -Dplay.version=${{ matrix.play }} "++${{ matrix.scala }}" test

  browser:
    name: Runtime and native Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: sbt javaExample/stage scalaExample/stage
      - run: bash scripts/browser-check.sh

  distribution:
    name: Install published JARs in independent applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: >-
          sbt 'set webmcp / publishTo := Some(Resolver.file("staging", file("target/maven-repository"))(Resolver.mavenStylePatterns))' +webmcp/publish
      - run: WEBMCP_REPOSITORY="file://$PWD/target/maven-repository" bash scripts/consumer-check.sh
